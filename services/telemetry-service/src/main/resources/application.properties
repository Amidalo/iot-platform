spring.application.name=telemetry-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/telemetry-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Адрес device-service. localhost:8080 — для локального запуска вне Docker.
# При запуске через docker-compose это значение переопределяется через env (имя сервиса вместо localhost).
app.device-service.url=http://localhost:8080

app.mqtt.broker-url=tcp://localhost:1883
app.mqtt.client-id=telemetry-service
app.mqtt.topic-filter=sensors/+/reading