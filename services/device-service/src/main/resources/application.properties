spring.application.name=device-service

spring.datasource.url=jdbc:postgresql://localhost:5433/device-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Явный список origin'ов, которым разрешено дёргать API.
# 5173 — порт Vite dev-сервера (React-frontend, npm run dev).
# В продакшене здесь будет реальный домен frontend'а, например
# https://iot-platform.example.com
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173