name: telemetry-service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/telemetry-service/**"
      - ".github/workflows/telemetry-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "services/telemetry-service/**"
      - ".github/workflows/telemetry-service.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetry-db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telemetry-db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: services/telemetry-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"
          cache: "maven"

      - name: Run tests
        run: mvn clean test -B

      - name: Build jar
        run: mvn clean package -DskipTests -B

      - name: Build Docker image
        run: docker build -t telemetry-service:${{ github.sha }} .
