name: device-service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/device-service/**"
      - ".github/workflows/device-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "services/device-service/**"
      - ".github/workflows/device-service.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: device-db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: services/device-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"
          cache: "maven"

      - name: Run tests
        run: mvn clean test -B

      - name: Build jar
        run: mvn clean package -DskipTests -B

      - name: Build Docker image
        run: docker build -t device-service:${{ github.sha }} .
